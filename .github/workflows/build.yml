                  String s;
                  if (!overlay) s = "先给悬浮窗权限，桌宠才能浮在其他应用上面。";
                  else if (!PetService.running) s = "权限齐了，点「召唤桌宠」。";
                  else s = "桌宠运行中。点人头说话，拖动换位置，长按回到这里。";
                  status.setText(s);
              }

              // ------------------------------------------------------------------ 角色设置

              private void addPetSection(LinearLayout root, Pets.Pet pet) {
                  root.addView(header(pet.name + "（" + pet.clips.size() + " 句）"));
                  root.addView(toggle("显示在屏幕上", prefs.visible(pet.id), v -> prefs.setVisible(pet.id, v)));

                  // 播放方式
                  RadioGroup mode = new RadioGroup(this);
                  mode.setOrientation(RadioGroup.HORIZONTAL);
                  RadioButton rRandom = new RadioButton(this);
                  rRandom.setText("随机一句");
                  rRandom.setId(View.generateViewId());
                  RadioButton rFixed = new RadioButton(this);
                  rFixed.setText("固定播一句");
                  rFixed.setId(View.generateViewId());
                  mode.addView(rRandom);
                  mode.addView(rFixed);
                  mode.check(prefs.fixedMode(pet.id) ? rFixed.getId() : rRandom.getId());
                  root.addView(mode);

                  final Spinner pin = new Spinner(this);
                  List<String> labels = new ArrayList<>();
                  for (Pets.Clip c : pet.clips) labels.add(String.format("%02d  %s", c.id, c.label));
                  ArrayAdapter<String> ad = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, labels);
                  ad.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  pin.setAdapter(ad);
                  int pinnedIdx = 0;
                  for (int i = 0; i < pet.clips.size(); i++) if (pet.clips.get(i).id == prefs.pinned(pet.id)) pinnedIdx = i;
                  pin.setSelection(pinnedIdx, false);
                  if (prefs.pinned(pet.id) < 0) prefs.setPinned(pet.id, pet.clips.get(0).id);
                  pin.setEnabled(prefs.fixedMode(pet.id));
                  pin.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(AdapterView<?> parent, View view, int position, long id) {
                          prefs.setPinned(pet.id, pet.clips.get(position).id);
                      }

                      @Override
                      public void onNothingSelected(AdapterView<?> parent) { }
                  });
                  root.addView(pin);
                  mode.setOnCheckedChangeListener((g, checked) -> {
                      boolean fixed = checked == rFixed.getId();
                      prefs.setFixedMode(pet.id, fixed);
                      pin.setEnabled(fixed);
                  });

                  // 轮播内容（折叠）
                  final LinearLayout list = column();
                  list.setVisibility(View.GONE);
                  final Button expand = button("", null);
                  final Runnable updateExpand = () -> {
                      int on = pet.clips.size() - prefs.excluded(pet).size();
                      expand.setText("轮播内容：已选 " + on + " / " + pet.clips.size()
                              + (list.getVisibility() == View.VISIBLE ? "  ▴" : "  ▾"));
                  };
                  expand.setOnClickListener(v -> {
                      list.setVisibility(list.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                      updateExpand.run();
                  });
                  updateExpand.run();
                  root.addView(expand);

                  final List<CheckBox> boxes = new ArrayList<>();
                  Set<Integer> excluded = prefs.excluded(pet);
                  for (Pets.Clip c : pet.clips) {
                      LinearLayout r = row();
                      r.setGravity(Gravity.CENTER_VERTICAL);
                      CheckBox cb = new CheckBox(this);
                      cb.setText(String.format("%02d  %s", c.id, c.label));
                      cb.setChecked(!excluded.contains(c.id));
                      cb.setOnCheckedChangeListener((b, on) -> {
                          Set<Integer> ex = prefs.excluded(pet);
                          if (on) ex.remove(c.id); else ex.add(c.id);
                          prefs.setExcluded(pet.id, ex);
                          updateExpand.run();
                      });
                      boxes.add(cb);
                      r.addView(cb, weighted());
                      Button play = button("▶", v -> playPreview(c));
                      play.setMinWidth(dp(48));
                      play.setMinimumWidth(dp(48));
                      r.addView(play, new LinearLayout.LayoutParams(dp(56), ViewGroup.LayoutParams.WRAP_CONTENT));
                      list.addView(r);
                  }
                  LinearLayout tools = row();
                  tools.addView(button("全选", v -> {
                      prefs.setExcluded(pet.id, new java.util.HashSet<>());
                      for (CheckBox b : boxes) b.setChecked(true);
                      updateExpand.run();
                  }), weighted());
                  tools.addView(button("恢复默认", v -> {
                      prefs.resetExcluded(pet.id);
                      Set<Integer> ex = prefs.excluded(pet);
                      for (int i = 0; i < boxes.size(); i++) boxes.get(i).setChecked(!ex.contains(pet.clips.get(i).id));
                      prefs.resetExcluded(pet.id);
                      updateExpand.run();
                  }), weighted());
                  list.addView(tools);
                  root.addView(list);
              }

              private void playPreview(Pets.Clip c) {
                  stopPreview();
                  MediaPlayer mp = new MediaPlayer();
                  try (AssetFileDescriptor afd = getAssets().openFd(c.file)) {
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                      mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      mp.prepare();
                  } catch (Exception e) {
                      mp.release();
                      return;
                  }
                  float vol = prefs.volume() / 100f;
                  mp.setVolume(vol, vol);
                  mp.setOnCompletionListener(done -> {
                      if (preview == done) preview = null;
                      done.release();
                  });
                  preview = mp;
                  mp.start();
              }

              private void stopPreview() {
                  if (preview != null) {
                      try { preview.stop(); } catch (RuntimeException ignored) { }
                      preview.release();
                      preview = null;
                  }
              }

              // ------------------------------------------------------------------ 小工具

              interface BoolSink { void set(boolean v); }

              interface SeekSink { void set(int value, boolean done); }

              private LinearLayout column() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }

              private LinearLayout.LayoutParams weighted() {
                  return new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
              }

              private TextView text(String s, int sp) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setPadding(0, dp(6), 0, dp(2));
                  return t;
              }

              private TextView hint(String s) {
                  TextView t = text(s, 12);
                  t.setAlpha(0.65f);
                  return t;
              }

              private TextView header(String s) {
                  TextView t = text(s, 18);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setPadding(0, dp(22), 0, dp(4));
                  return t;
              }

              private Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  if (l != null) b.setOnClickListener(l);
                  return b;
              }

              private Switch toggle(String s, boolean on, BoolSink sink) {
                  Switch sw = new Switch(this);
                  sw.setText(s);
                  sw.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  sw.setChecked(on);
                  sw.setPadding(0, dp(8), 0, dp(4));
                  sw.setOnCheckedChangeListener((b, v) -> sink.set(v));
                  return sw;
              }

              private SeekBar seek(int min, int max, int value, SeekSink sink) {
                  SeekBar sb = new SeekBar(this);
                  sb.setMin(min);
                  sb.setMax(max);
                  sb.setProgress(value);
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) { sink.set(p, false); }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) { }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) { sink.set(s.getProgress(), true); }
                  });
                  return sb;
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'tools/prepare_assets.py')"
          cat > 'tools/prepare_assets.py' <<'PETTRIO_FILE_END'
          #!/usr/bin/env python3
          """把三个原版仓库的音频、头像和台词表整理成安卓 App 用的 assets。

          用法：python3 tools/prepare_assets.py <上游仓库所在目录> <本项目根目录>

          只用 Python 标准库。开头静音（lead）和真实时长（probe）事先用 ffmpeg 量好，放在 tools/leads.json，
          接话时按它补偿起播时刻，算法和 macOS 原版的 leadingSilence 一致。
          """
          import json
          import os
          import shutil
          import sys

          # 顺序 = 屏幕上从上到下的摆放顺序，也是接话链的顺序。
          PETS = [
              # id,        名字,     上游仓库,              接话句池（None = 全部句子，[] = 只说不接）
              ("shaolan", "薄肌",   "ShaolanPet",          []),
              ("sun",     "太对了", "SunPet",              [1, 2, 4, 11, 13, 14]),
              ("fengge",  "峰哥",   "FengGe-Desktop-Pet",  None),
          ]


          def main():
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              upstream, project = sys.argv[1], sys.argv[2]
              leads = json.load(open(os.path.join(project, "tools", "leads.json"), encoding="utf-8"))
              assets = os.path.join(project, "app", "src", "main", "assets", "pets")
              if os.path.isdir(assets):
                  shutil.rmtree(assets)
              os.makedirs(assets)

              out = []
              for pid, name, repo, companion in PETS:
                  src = os.path.join(upstream, repo, "Assets")
                  dst = os.path.join(assets, pid)
                  os.makedirs(dst)
                  shutil.copyfile(os.path.join(src, "face.png"), os.path.join(dst, "face.png"))
                  clips = json.load(open(os.path.join(src, "clips.json"), encoding="utf-8"))
                  items = []
                  for c in clips:
                      shutil.copyfile(os.path.join(src, "Clips", c["file"]), os.path.join(dst, c["file"]))
                      m = leads.get(pid, {}).get(c["file"], {})
                      items.append({
                          "id": c["id"],
                          "label": c["label"],
                          "file": "pets/%s/%s" % (pid, c["file"]),
                          "duration": m.get("probe", c.get("duration", 1.0)),
                          "lead": m.get("lead", 0.0),
                          "defaultOff": bool(c.get("defaultOff", False)),
                      })
                  comp = [c["id"] for c in clips] if companion is None else companion
                  out.append({"id": pid, "name": name, "face": "pets/%s/face.png" % pid,
                              "companion": comp, "clips": items})
                  print("%-8s %2d 句" % (name, len(items)))

              with open(os.path.join(assets, "pets.json"), "w", encoding="utf-8") as f:
                  json.dump({"pets": out}, f, ensure_ascii=False, indent=1)

              # App 图标用太对了的头像。
              icon_dir = os.path.join(project, "app", "src", "main", "res", "drawable-nodpi")
              os.makedirs(icon_dir, exist_ok=True)
              shutil.copyfile(os.path.join(upstream, "SunPet", "Assets", "face.png"), os.path.join(icon_dir, "app_icon.png"))
              print("assets 准备好了：", assets)


          if __name__ == "__main__":
              main()
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'tools/fetch_upstream.sh')"
