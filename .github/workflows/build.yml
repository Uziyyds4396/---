      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 拉取三个原版桌宠的素材
        run: bash tools/fetch_upstream.sh "$RUNNER_TEMP/upstream"

      - name: 整理 assets
        run: python3 tools/prepare_assets.py "$RUNNER_TEMP/upstream" .

      - name: 编译 APK
        run: gradle --no-daemon :app:assembleRelease

      - name: 改名
        run: cp app/build/outputs/apk/release/app-release.apk PetTrio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PetTrio-apk
          path: PetTrio.apk

      - name: 发布到 Releases（手机上直接点链接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" PetTrio.apk \
            --repo "${{ github.repository }}" \
            --title "桌宠三连 · 第 ${{ github.run_number }} 版" \
            --notes "下载 PetTrio.apk 装到手机。首次打开授予「显示在其他应用上层」权限，然后点「召唤桌宠」。"
