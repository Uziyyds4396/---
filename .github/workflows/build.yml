# 桌宠三连 · 安卓版（薄肌 · 太对了 · 峰哥）—— 单文件版
# 用法：新建一个 GitHub 仓库 → Add file → Create new file
#       文件名填 .github/workflows/build.yml → 把本文件全文粘进去 → Commit
#       等 3–5 分钟，去仓库的 Releases 下载 PetTrio.apk
# 素材在编译时从 Ganzhe2028 的三个原版仓库拉取，版权归原权利人，仅供学习玩梗，请勿商用。

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 生成项目文件
        run: |
          mkdir -p "$(dirname 'settings.gradle')"
          cat > 'settings.gradle' <<'PETTRIO_FILE_END'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PetTrio"
          include ':app'
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'build.gradle')"
          cat > 'build.gradle' <<'PETTRIO_FILE_END'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'PETTRIO_FILE_END'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/build.gradle')"
          cat > 'app/build.gradle' <<'PETTRIO_FILE_END'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'local.pettrio'
              compileSdk 34

              defaultConfig {
                  applicationId 'local.pettrio'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              // 固定签名：以后重新编译的新版本可以直接覆盖安装，不用先卸载。
              signingConfigs {
                  fixed {
                      storeFile file('pettrio.keystore')
                      storePassword 'pettrio'
                      keyAlias 'pettrio'
                      keyPassword 'pettrio'
                      storeType 'pkcs12'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixed
                  }
                  release {
                      signingConfig signingConfigs.fixed
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              // 音频要能用 AssetManager.openFd 直接读，必须不压缩。
              androidResources {
                  noCompress 'wav', 'm4a'
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'PETTRIO_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="桌宠三连"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".PetService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating desktop pet overlay that plays short voice clips when tapped" />
                  </service>
              </application>
          </manifest>
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_stat.xml')"
          cat > 'app/src/main/res/drawable/ic_stat.xml' <<'PETTRIO_FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2A10,10 0,1 1,12,22A10,10 0,1 1,12,2ZM8.5,9A1.5,1.5 0,1 0,8.5,12A1.5,1.5 0,1 0,8.5,9ZM15.5,9A1.5,1.5 0,1 0,15.5,12A1.5,1.5 0,1 0,15.5,9ZM7.5,14.5L16.5,14.5C15.8,16.6 14.1,18 12,18C9.9,18 8.2,16.6 7.5,14.5Z" />
          </vector>
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/java/local/pettrio/Pets.java')"
          cat > 'app/src/main/java/local/pettrio/Pets.java' <<'PETTRIO_FILE_END'
          package local.pettrio;

          import android.content.Context;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          /** 三个角色和它们的台词。数据来自 assets/pets/pets.json（构建时由 tools/prepare_assets.py 生成）。 */
          public final class Pets {

              public static final String SHAOLAN = "shaolan";
              public static final String SUN = "sun";
              public static final String FENGGE = "fengge";

              public static final class Clip {
                  public final int id;
                  public final String label;
                  public final String file;
                  public final double duration;
                  /** 开头静音秒数，接话时用来补偿起播时刻。 */
                  public final double lead;
                  public final boolean defaultOff;

                  Clip(int id, String label, String file, double duration, double lead, boolean defaultOff) {
                      this.id = id;
                      this.label = label;
                      this.file = file;
                      this.duration = duration;
                      this.lead = lead;
                      this.defaultOff = defaultOff;
                  }
              }

              public static final class Pet {
                  public final String id;
                  public final String name;
                  public final String face;
                  public final List<Clip> clips;
                  /** 被别人接话时可用的句子 id；空 = 只说不接。 */
                  public final Set<Integer> companionIds;

                  Pet(String id, String name, String face, List<Clip> clips, Set<Integer> companionIds) {
                      this.id = id;
                      this.name = name;
                      this.face = face;
                      this.clips = Collections.unmodifiableList(clips);
                      this.companionIds = Collections.unmodifiableSet(companionIds);
                  }

                  public Clip clip(int clipId) {
                      for (Clip c : clips) if (c.id == clipId) return c;
                      return null;
                  }
              }

              private static List<Pet> cache;

              private Pets() {}

              public static synchronized List<Pet> all(Context ctx) {
                  if (cache != null) return cache;
                  List<Pet> out = new ArrayList<>();
                  try (InputStream in = ctx.getAssets().open("pets/pets.json")) {
                      ByteArrayOutputStream buf = new ByteArrayOutputStream();
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) buf.write(b, 0, n);
                      JSONArray arr = new JSONObject(new String(buf.toByteArray(), StandardCharsets.UTF_8)).getJSONArray("pets");
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject p = arr.getJSONObject(i);
                          List<Clip> clips = new ArrayList<>();
                          JSONArray ca = p.getJSONArray("clips");
                          for (int j = 0; j < ca.length(); j++) {
                              JSONObject c = ca.getJSONObject(j);
                              clips.add(new Clip(c.getInt("id"), c.getString("label"), c.getString("file"),
                                      c.optDouble("duration", 1.0), c.optDouble("lead", 0.0), c.optBoolean("defaultOff", false)));
                          }
                          Set<Integer> comp = new HashSet<>();
                          JSONArray co = p.optJSONArray("companion");
                          if (co != null) for (int j = 0; j < co.length(); j++) comp.add(co.getInt(j));
                          out.add(new Pet(p.getString("id"), p.getString("name"), p.getString("face"), clips, comp));
                      }
                  } catch (Exception e) {
                      throw new IllegalStateException("读取 pets.json 失败：" + e, e);
                  }
                  cache = Collections.unmodifiableList(out);
                  return cache;
              }

              public static Pet byId(Context ctx, String id) {
                  for (Pet p : all(ctx)) if (p.id.equals(id)) return p;
                  return null;
              }
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/java/local/pettrio/Prefs.java')"
          cat > 'app/src/main/java/local/pettrio/Prefs.java' <<'PETTRIO_FILE_END'
          package local.pettrio;

          import android.content.Context;
          import android.content.SharedPreferences;

          import java.util.HashSet;
          import java.util.Set;

          /** 所有设置都存在这里，桌宠服务和设置页共用。 */
          public final class Prefs {

              public static final String KEY_CHAIN = "chain";
              public static final String KEY_SHAKE = "shake";
              public static final String KEY_VOLUME = "volume";
              public static final String KEY_SIZE = "size";
              public static final String PREFIX_VISIBLE = "visible_";

              private final SharedPreferences sp;

              public Prefs(Context ctx) {
                  sp = ctx.getApplicationContext().getSharedPreferences("pets", Context.MODE_PRIVATE);
              }

              public SharedPreferences raw() { return sp; }

              // ---- 全局 ----
              public boolean chain() { return sp.getBoolean(KEY_CHAIN, true); }
              public void setChain(boolean v) { sp.edit().putBoolean(KEY_CHAIN, v).apply(); }

              public boolean shake() { return sp.getBoolean(KEY_SHAKE, false); }
              public void setShake(boolean v) { sp.edit().putBoolean(KEY_SHAKE, v).apply(); }

              /** 0–100 */
              public int volume() { return sp.getInt(KEY_VOLUME, 80); }
              public void setVolume(int v) { sp.edit().putInt(KEY_VOLUME, v).apply(); }

              /** 头像边长，单位 dp。 */
              public int sizeDp() { return sp.getInt(KEY_SIZE, 110); }
              public void setSizeDp(int v) { sp.edit().putInt(KEY_SIZE, v).apply(); }

              // ---- 每个角色 ----
              public boolean visible(String pet) { return sp.getBoolean(PREFIX_VISIBLE + pet, true); }
              public void setVisible(String pet, boolean v) { sp.edit().putBoolean(PREFIX_VISIBLE + pet, v).apply(); }

              /** true = 固定播一句；false = 随机一句。 */
              public boolean fixedMode(String pet) { return sp.getBoolean("fixed_" + pet, false); }
              public void setFixedMode(String pet, boolean v) { sp.edit().putBoolean("fixed_" + pet, v).apply(); }

              public int pinned(String pet) { return sp.getInt("pinned_" + pet, -1); }
              public void setPinned(String pet, int clipId) { sp.edit().putInt("pinned_" + pet, clipId).apply(); }

              /** 被勾掉、不进随机轮播的句子。第一次用时按素材里的 defaultOff 给默认值。 */
              public Set<Integer> excluded(Pets.Pet pet) {
                  Set<String> raw = sp.getStringSet("excluded_" + pet.id, null);
                  Set<Integer> out = new HashSet<>();
                  if (raw == null) {
                      for (Pets.Clip c : pet.clips) if (c.defaultOff) out.add(c.id);
                      return out;
                  }
                  for (String s : raw) {
                      try { out.add(Integer.parseInt(s)); } catch (NumberFormatException ignored) { }
                  }
                  return out;
              }

              public void setExcluded(String pet, Set<Integer> ids) {
                  Set<String> raw = new HashSet<>();
                  for (Integer i : ids) raw.add(String.valueOf(i));
                  sp.edit().putStringSet("excluded_" + pet, raw).apply();
              }

              public void resetExcluded(String pet) { sp.edit().remove("excluded_" + pet).apply(); }

              // ---- 位置（像素，-1 表示还没摆过） ----
              public int posX(String pet) { return sp.getInt("x_" + pet, -1); }
              public int posY(String pet) { return sp.getInt("y_" + pet, -1); }
              public void setPos(String pet, int x, int y) { sp.edit().putInt("x_" + pet, x).putInt("y_" + pet, y).apply(); }

              public void clearPositions(Iterable<Pets.Pet> pets) {
                  SharedPreferences.Editor e = sp.edit();
                  for (Pets.Pet p : pets) e.remove("x_" + p.id).remove("y_" + p.id);
                  e.apply();
              }
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/java/local/pettrio/PetView.java')"
          cat > 'app/src/main/java/local/pettrio/PetView.java' <<'PETTRIO_FILE_END'
          package local.pettrio;

          import android.animation.ValueAnimator;
          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.view.animation.LinearInterpolator;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /** 一个悬浮的人头：上面是头像，下面是说话时冒出来的字幕气泡。 */
          @SuppressLint("ViewConstructor")
          final class PetView extends LinearLayout {

              final Pets.Pet pet;
              final ImageView face;
              final TextView caption;
              final WindowManager.LayoutParams lp;
              final int facePx;

              private ValueAnimator sway;
              private final Runnable hideCaption;

              PetView(Context ctx, Pets.Pet pet, Bitmap bitmap, int facePx) {
                  super(ctx);
                  this.pet = pet;
                  this.facePx = facePx;
                  setOrientation(VERTICAL);
                  setGravity(Gravity.CENTER_HORIZONTAL);
                  // 说话时头会往上跳几像素，顶上留点空，不然会被窗口边裁掉。
                  int pad = dp(4);
                  setPadding(0, pad, 0, 0);
                  setClipChildren(false);
                  setClipToPadding(false);

                  face = new ImageView(ctx);
                  face.setImageBitmap(bitmap);
                  face.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  face.setContentDescription(pet.name);
                  addView(face, new LayoutParams(facePx, facePx));

                  caption = new TextView(ctx);
                  caption.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  caption.setTextColor(0xFF1F1F1F);
                  caption.setGravity(Gravity.CENTER);
                  caption.setMaxLines(3);
                  caption.setEllipsize(TextUtils.TruncateAt.END);
                  caption.setPadding(dp(6), dp(3), dp(6), dp(3));
                  GradientDrawable bubble = new GradientDrawable();
                  bubble.setColor(0xF2FFFFFF);
                  bubble.setCornerRadius(dp(10));
                  bubble.setStroke(Math.max(1, dp(1) / 2), 0x33000000);
                  caption.setBackground(bubble);
                  caption.setVisibility(GONE);
                  hideCaption = () -> caption.setVisibility(GONE);
                  LayoutParams clp = new LayoutParams(LayoutParams.MATCH_PARENT, LayoutParams.WRAP_CONTENT);
                  clp.topMargin = dp(2);
                  addView(caption, clp);

                  lp = new WindowManager.LayoutParams(
                          facePx,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                          PixelFormat.TRANSLUCENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
              }

              /** 字幕 + 顶部留白最多占多高，摆位置时要给它留出来。 */
              int captionReservePx() { return dp(48); }

              void showCaption(String text, long millis) {
                  removeCallbacks(hideCaption);
                  caption.setText(text);
                  caption.setVisibility(VISIBLE);
                  postDelayed(hideCaption, millis);
              }

              /** 说话时左右轻摇、上下轻跳，和 macOS 原版同一个节奏。 */
              void setSpeaking(boolean speaking) {
                  if (sway != null) {
                      sway.cancel();
                      sway = null;
                  }
                  face.setRotation(0f);
                  face.setTranslationY(0f);
                  if (!speaking) return;
                  final float jump = dp(3);
                  sway = ValueAnimator.ofFloat(0f, 1f);
                  sway.setDuration(1000);
                  sway.setRepeatCount(ValueAnimator.INFINITE);
                  sway.setInterpolator(new LinearInterpolator());
                  final long start = System.nanoTime();
                  sway.addUpdateListener(a -> {
                      // 原版每 1/30 秒相位 +0.38，相当于每秒 11.4 弧度。
                      double phase = (System.nanoTime() - start) / 1e9 * 11.4;
                      face.setRotation((float) Math.toDegrees(Math.sin(phase) * 0.055));
                      face.setTranslationY((float) (-Math.abs(Math.sin(phase)) * jump));
                  });
                  sway.start();
              }

              void release() {
                  setSpeaking(false);
                  removeCallbacks(hideCaption);
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }
          }
          PETTRIO_FILE_END
          mkdir -p "$(dirname 'app/src/main/java/local/pettrio/PetService.java')"
          cat > 'app/src/main/java/local/pettrio/PetService.java' <<'PETTRIO_FILE_END'
          package local.pettrio;

          import android.annotation.SuppressLint;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.content.res.AssetFileDescriptor;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Point;
          import android.graphics.Rect;
          import android.graphics.drawable.Icon;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.HapticFeedbackConstants;
          import android.view.MotionEvent;
          import android.view.ViewConfiguration;
          import android.view.WindowManager;
          import android.widget.Toast;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;

          /**
           * 常驻前台服务：管三个悬浮人头、放音频、跑接话链、摇一摇。
           *
           * 接话链和 macOS 原版一致：
           *   薄肌 ──> 太对了 ──> 峰哥 ──> 太对了
           * 点薄肌：四句一串。点峰哥：太对了接一句就停。点太对了：没人接。
           * 靠 hop（第几跳）封顶防止无限接，靠 root（谁起的头）决定峰哥接不接。
           */
          public class PetService extends Service
                  implements SharedPreferences.OnSharedPreferenceChangeListener, SensorEventListener {

              public static final String ACTION_START = "local.pettrio.START";
              public static final String ACTION_TOGGLE = "local.pettrio.TOGGLE";
              public static final String ACTION_QUIT = "local.pettrio.QUIT";
              public static final String ACTION_RESET = "local.pettrio.RESET";

              private static final String CHANNEL = "pets";
              private static final int NOTIF_ID = 1;
              /** 默认提前 0.3 秒叠进来；第二跳（太对了 → 峰哥）压到 0.2 秒，四步连起来才不拖。 */
              private static final double OVERLAP = 0.3;
              private static final double OVERLAP_HOP1 = 0.2;
              private static final int MAX_HOP = 3;

              static volatile boolean running;
              static volatile boolean hidden;

              private final Handler main = new Handler(Looper.getMainLooper());
              private WindowManager wm;
              private Prefs prefs;
              private List<Pets.Pet> pets;

              private final Map<String, PetView> views = new LinkedHashMap<>();
              private final Map<String, Bitmap> faces = new HashMap<>();
              private final Map<String, MediaPlayer> players = new HashMap<>();
              private final Map<String, Runnable> pendingReplies = new HashMap<>();
              private final Map<String, List<Integer>> bags = new HashMap<>();
              private final Map<String, List<Integer>> companionBags = new HashMap<>();
              private final Map<String, Integer> lastSaid = new HashMap<>();
              /** 每个角色当前这句预计在什么时候说完（uptimeMillis）。 */
              private final Map<String, Long> speakEndsAt = new HashMap<>();
              /** 接话时允许压掉自己上一句的最后这么多毫秒（多半是尾部静音），不然安卓回调稍慢就会把接话吞掉。 */
              private static final long BUSY_TOLERANCE_MS = 120;

              private SensorManager sensors;
              private boolean sensorOn;
              private long lastShake;
              private boolean hintShown;

              // ------------------------------------------------------------------ 生命周期

              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  sensors = (SensorManager) getSystemService(SENSOR_SERVICE);
                  prefs = new Prefs(this);
                  pets = Pets.all(this);
                  prefs.raw().registerOnSharedPreferenceChangeListener(this);
                  createChannel();
                  running = true;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  goForeground();
                  String action = intent != null && intent.getAction() != null ? intent.getAction() : ACTION_START;
                  switch (action) {
                      case ACTION_QUIT:
                          quit();
                          return START_NOT_STICKY;
                      case ACTION_TOGGLE:
                          hidden = !hidden;
                          if (hidden) removeAll(); else showAll();
                          break;
                      case ACTION_RESET:
                          prefs.clearPositions(pets);
                          if (!hidden) { removeAll(); showAll(); }
                          break;
                      case ACTION_START:
                      default:
                          hidden = false;
                          showAll();
                          break;
                  }
                  goForeground();
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  prefs.raw().unregisterOnSharedPreferenceChangeListener(this);
                  removeAll();
                  main.removeCallbacksAndMessages(null);
                  running = false;
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              private void quit() {
                  removeAll();
                  running = false;
                  hidden = false;
                  stopForeground(STOP_FOREGROUND_REMOVE);
                  stopSelf();
              }

              @Override
              public void onConfigurationChanged(Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  // 横竖屏切换后，把跑出屏幕的人头拉回来。
                  for (PetView v : views.values()) {
                      clampAndApply(v);
                  }
              }

              // ------------------------------------------------------------------ 通知栏

              private void createChannel() {
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "桌宠常驻", NotificationManager.IMPORTANCE_MIN);
                  ch.setDescription("桌宠在屏幕上时显示，可以从这里隐藏或退出");
                  ch.setShowBadge(false);
                  getSystemService(NotificationManager.class).createNotificationChannel(ch);
              }

              private void goForeground() {
                  Notification n = buildNotification();
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  } else {
                      startForeground(NOTIF_ID, n);
                  }
              }

              private Notification buildNotification() {
                  PendingIntent open = PendingIntent.getActivity(this, 0,
                          new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Icon icon = Icon.createWithResource(this, R.drawable.ic_stat);
                  return new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(hidden ? "桌宠已隐藏" : "桌宠在屏幕上")
                          .setContentText("点这里打开设置 · 长按人头也能打开")
                          .setContentIntent(open)
                          .setOngoing(true)
                          .setShowWhen(false)
                          .addAction(new Notification.Action.Builder(icon, hidden ? "显示" : "隐藏", servicePI(ACTION_TOGGLE, 1)).build())
                          .addAction(new Notification.Action.Builder(icon, "退出", servicePI(ACTION_QUIT, 2)).build())
                          .build();
              }

              private PendingIntent servicePI(String action, int req) {
                  Intent i = new Intent(this, PetService.class).setAction(action);
                  return PendingIntent.getService(this, req, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              // ------------------------------------------------------------------ 悬浮窗

              private void showAll() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "还没给「显示在其他应用上层」权限", Toast.LENGTH_LONG).show();
                      return;
                  }
                  int facePx = dp(prefs.sizeDp());
                  for (int i = 0; i < pets.size(); i++) {
                      Pets.Pet p = pets.get(i);
                      if (!prefs.visible(p.id) || views.containsKey(p.id)) continue;
                      addPet(p, i, facePx);
                  }
                  if (!hintShown && !views.isEmpty()) {
                      hintShown = true;
                      for (PetView v : views.values()) v.showCaption("点我说一句 · 长按设置", 4000);
                  }
                  updateSensor();
              }

              private void addPet(Pets.Pet p, int slot, int facePx) {
                  PetView v = new PetView(this, p, face(p), facePx);
                  Point s = screen();
                  int x = prefs.posX(p.id);
                  int y = prefs.posY(p.id);
                  if (x < 0 || y < 0) {
                      // 默认摆在右下角，三个竖着排开，不叠在一起。
                      int cell = facePx + v.captionReservePx();
                      x = s.x - facePx - dp(12);
                      y = s.y - dp(120) - (pets.size() - slot) * cell;
                  }
                  v.lp.x = x;
                  v.lp.y = y;
                  clamp(v);
                  attachTouch(v);
                  try {
                      wm.addView(v, v.lp);
                      views.put(p.id, v);
                  } catch (RuntimeException e) {
                      Toast.makeText(this, "悬浮窗添加失败：" + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void removeAll() {
                  for (String id : new ArrayList<>(views.keySet())) removePet(id);
                  for (Runnable r : pendingReplies.values()) main.removeCallbacks(r);
                  pendingReplies.clear();
                  updateSensor();
              }

              private void removePet(String id) {
                  stopPlayer(id);
                  Runnable r = pendingReplies.remove(id);
                  if (r != null) main.removeCallbacks(r);
                  PetView v = views.remove(id);
                  if (v == null) return;
                  v.release();
                  try { wm.removeView(v); } catch (RuntimeException ignored) { }
              }

              private Bitmap face(Pets.Pet p) {
                  Bitmap b = faces.get(p.id);
                  if (b != null) return b;
                  try (InputStream in = getAssets().open(p.face)) {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeStream(in, null, o);
                      int sample = 1;
                      // 原图 800–1300px，缩到 400px 以上最小的 2 的幂次，省内存。
                      while (Math.min(o.outWidth, o.outHeight) / (sample * 2) >= 400) sample *= 2;
                      try (InputStream in2 = getAssets().open(p.face)) {
                          BitmapFactory.Options o2 = new BitmapFactory.Options();
                          o2.inSampleSize = sample;
                          b = BitmapFactory.decodeStream(in2, null, o2);
                      }
                  } catch (IOException e) {
                      b = Bitmap.createBitmap(8, 8, Bitmap.Config.ARGB_8888);
                  }
                  faces.put(p.id, b);
                  return b;
              }

              @SuppressLint("ClickableViewAccessibility")
              private void attachTouch(final PetView v) {
                  final int slop = ViewConfiguration.get(this).getScaledTouchSlop();
                  final long longPressMs = ViewConfiguration.getLongPressTimeout();
                  final float[] down = new float[2];
                  final int[] start = new int[2];
                  final boolean[] state = new boolean[2]; // [0] 正在拖动  [1] 已触发长按
                  final Runnable longPress = () -> {
                      state[1] = true;
                      v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);
                      openSettings();
                  };
                  v.setOnTouchListener((view, e) -> {
                      switch (e.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              down[0] = e.getRawX();
                              down[1] = e.getRawY();
                              start[0] = v.lp.x;
                              start[1] = v.lp.y;
                              state[0] = false;
                              state[1] = false;
                              main.postDelayed(longPress, longPressMs);
                              return true;
                          case MotionEvent.ACTION_MOVE: {
                              float dx = e.getRawX() - down[0];
                              float dy = e.getRawY() - down[1];
                              if (!state[0] && !state[1] && Math.hypot(dx, dy) > slop) {
                                  state[0] = true;
                                  main.removeCallbacks(longPress);
                              }
                              if (state[0]) {
                                  v.lp.x = start[0] + Math.round(dx);
                                  v.lp.y = start[1] + Math.round(dy);
                                  clampAndApply(v);
                              }
                              return true;
                          }
                          case MotionEvent.ACTION_UP:
                              main.removeCallbacks(longPress);
                              if (state[0]) {
                                  prefs.setPos(v.pet.id, v.lp.x, v.lp.y);
                              } else if (!state[1]) {
                                  onTap(v.pet);
                              }
                              return true;
                          case MotionEvent.ACTION_CANCEL:
                              main.removeCallbacks(longPress);
                              if (state[0]) prefs.setPos(v.pet.id, v.lp.x, v.lp.y);
                              return true;
                          default:
                              return false;
                      }
                  });
              }

              private void openSettings() {
                  Intent i = new Intent(this, MainActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT);
                  try {
                      startActivity(i);
                  } catch (RuntimeException e) {
                      Toast.makeText(this, "打不开设置，请从通知栏或桌面图标进入", Toast.LENGTH_SHORT).show();
                  }
              }

              private void clamp(PetView v) {
                  Point s = screen();
                  int maxX = Math.max(0, s.x - v.facePx);
                  int maxY = Math.max(0, s.y - v.facePx - v.captionReservePx());
                  v.lp.x = Math.max(0, Math.min(v.lp.x, maxX));
                  v.lp.y = Math.max(0, Math.min(v.lp.y, maxY));
              }

              private void clampAndApply(PetView v) {
                  clamp(v);
                  try { wm.updateViewLayout(v, v.lp); } catch (RuntimeException ignored) { }
              }

              private Point screen() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      Rect b = wm.getCurrentWindowMetrics().getBounds();
                      return new Point(b.width(), b.height());
                  }
                  DisplayMetrics dm = new DisplayMetrics();
                  //noinspection deprecation
                  wm.getDefaultDisplay().getRealMetrics(dm);
                  return new Point(dm.widthPixels, dm.heightPixels);
              }

              // ------------------------------------------------------------------ 说话

              private void onTap(Pets.Pet pet) {
                  Pets.Clip clip = null;
                  if (prefs.fixedMode(pet.id)) clip = pet.clip(prefs.pinned(pet.id));
                  if (clip == null) clip = nextRandom(pet);
                  if (clip == null) {
                      PetView v = views.get(pet.id);
                      if (v != null) v.showCaption("轮播里一句都没勾，长按去设置", 3000);
                      return;
                  }
                  speak(pet, clip, 0, pet.id);
              }

              /** 播一句。hop：这是接话链的第几跳（用户自己点的是 0）；root：这条链是谁起的头。 */
              private void speak(Pets.Pet pet, Pets.Clip clip, int hop, String root) {
                  stopPlayer(pet.id);
                  MediaPlayer mp = new MediaPlayer();
                  try (AssetFileDescriptor afd = getAssets().openFd(clip.file)) {
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_MEDIA)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build());
                      mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                      mp.prepare();
                  } catch (IOException | RuntimeException e) {
                      mp.release();
                      PetView v = views.get(pet.id);
                      if (v != null) v.showCaption("播放失败", 3000);
                      return;
                  }
                  float vol = prefs.volume() / 100f;
                  mp.setVolume(vol, vol);
                  mp.setOnCompletionListener(done -> {
                      if (players.get(pet.id) == done) {
                          players.remove(pet.id);
                          PetView v = views.get(pet.id);
                          if (v != null) v.setSpeaking(false);
                      }
                      done.release();
                  });
                  players.put(pet.id, mp);
                  mp.start();
                  lastSaid.put(pet.id, clip.id);
                  speakEndsAt.put(pet.id, SystemClock.uptimeMillis() + Math.round(clip.duration * 1000));

                  PetView v = views.get(pet.id);
                  if (v != null) {
                      v.setSpeaking(true);
                      v.showCaption(clip.label, Math.round((clip.duration + 0.5) * 1000));
                  }
                  if (prefs.chain()) announce(pet, clip, hop, root);
              }

              private void stopPlayer(String petId) {
                  MediaPlayer old = players.remove(petId);
                  if (old != null) {
                      try { old.stop(); } catch (RuntimeException ignored) { }
                      old.release();
                  }
                  PetView v = views.get(petId);
                  if (v != null) v.setSpeaking(false);
              }

              private boolean isSpeaking(String petId) {
                  if (!players.containsKey(petId)) return false;
                  Long end = speakEndsAt.get(petId);
                  return end == null || SystemClock.uptimeMillis() < end - BUSY_TOLERANCE_MS;
              }

              // ------------------------------------------------------------------ 接话链

              /** 谁听谁：太对了接薄肌和峰哥；峰哥只接「薄肌起头」的链里太对了的话；薄肌只说不接。 */
              private static boolean listens(String me, String from, String root) {
                  switch (me) {
                      case Pets.SUN:
                          return from.equals(Pets.SHAOLAN) || from.equals(Pets.FENGGE);
                      case Pets.FENGGE:
                          return from.equals(Pets.SUN) && root.equals(Pets.SHAOLAN);
                      default:
                          return false;
                  }
              }

              private void announce(Pets.Pet speaker, Pets.Clip clip, int hop, String root) {
                  if (hop >= MAX_HOP) return;
                  for (Pets.Pet other : pets) {
                      if (other == speaker || !views.containsKey(other.id)) continue;
                      if (!listens(other.id, speaker.id, root)) continue;
                      scheduleReply(other, clip.duration, hop, root);
                  }
              }

              private void scheduleReply(Pets.Pet me, double heardDuration, int hop, String root) {
                  // 被连点时只留最后一次的接话，不然几句叠在一起。
                  Runnable old = pendingReplies.remove(me.id);
                  if (old != null) main.removeCallbacks(old);
                  final Pets.Clip reply = nextCompanion(me);
                  if (reply == null) return;
                  // 目标：对方那句还剩 overlap 秒时，接话的第一个字正好出来。每句开头静音不同，按它自己的补。
                  double overlap = hop == 1 ? OVERLAP_HOP1 : OVERLAP;
                  long delay = Math.round(Math.max(0.02, heardDuration - overlap - reply.lead) * 1000);
                  Runnable r = new Runnable() {
                      @Override
                      public void run() {
                          if (pendingReplies.get(me.id) == this) pendingReplies.remove(me.id);
                          if (!prefs.chain() || !views.containsKey(me.id)) return;
                          // 自己正说着（刚被手点了）就不叠上去，这一捧算了。
                          if (isSpeaking(me.id)) return;
                          speak(me, reply, hop + 1, root);
                      }
                  };
                  pendingReplies.put(me.id, r);
                  main.postDelayed(r, delay);
              }

              // ------------------------------------------------------------------ 抽句子

              /** 随机一句：一轮播完前不重复，换轮时也不和上一句撞。 */
              private Pets.Clip nextRandom(Pets.Pet pet) {
                  Set<Integer> excluded = prefs.excluded(pet);
                  List<Integer> pool = new ArrayList<>();
                  for (Pets.Clip c : pet.clips) if (!excluded.contains(c.id)) pool.add(c.id);
                  return draw(pet, pool, bags);
              }

              private Pets.Clip nextCompanion(Pets.Pet pet) {
                  if (pet.companionIds.isEmpty()) return null;
                  Set<Integer> excluded = prefs.excluded(pet);
                  List<Integer> pool = new ArrayList<>();
                  for (Pets.Clip c : pet.clips) {
                      if (pet.companionIds.contains(c.id) && !excluded.contains(c.id)) pool.add(c.id);
                  }
                  if (pool.isEmpty()) {
                      // 捧哏句全被勾掉了，退回到完整的捧哏句池，联动不至于哑掉。
                      for (Pets.Clip c : pet.clips) if (pet.companionIds.contains(c.id)) pool.add(c.id);
                  }
                  return draw(pet, pool, companionBags);
              }

              private Pets.Clip draw(Pets.Pet pet, List<Integer> pool, Map<String, List<Integer>> store) {
                  if (pool.isEmpty()) return null;
                  List<Integer> bag = store.get(pet.id);
                  if (bag == null) {
                      bag = new ArrayList<>();
                      store.put(pet.id, bag);
                  }
                  bag.retainAll(pool);
                  if (bag.isEmpty()) {
                      bag.addAll(pool);
                      Collections.shuffle(bag);
                      Integer last = lastSaid.get(pet.id);
                      if (bag.size() > 1 && last != null && bag.get(bag.size() - 1).equals(last)) {
                          Collections.swap(bag, 0, bag.size() - 1);
                      }
                  }
                  return pet.clip(bag.remove(bag.size() - 1));
              }

              // ------------------------------------------------------------------ 摇一摇

              private void updateSensor() {
                  boolean want = prefs.shake() && !hidden && !views.isEmpty();
                  if (want == sensorOn) return;
                  if (want) {
                      Sensor acc = sensors.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                      if (acc == null) return;
                      sensors.registerListener(this, acc, SensorManager.SENSOR_DELAY_UI);
                      sensorOn = true;
                  } else {
                      sensors.unregisterListener(this);
                      sensorOn = false;
                  }
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float x = e.values[0], y = e.values[1], z = e.values[2];
                  double g = Math.sqrt(x * x + y * y + z * z) / SensorManager.GRAVITY_EARTH;
                  long now = SystemClock.elapsedRealtime();
                  if (g < 2.3 || now - lastShake < 1500) return;
                  lastShake = now;
                  // 和 Mac 原版一样，摇一摇是「太对了」开口；他被隐藏了就让第一个在场的说。
                  Pets.Pet who = views.containsKey(Pets.SUN) ? Pets.byId(this, Pets.SUN) : null;
                  if (who == null && !views.isEmpty()) who = views.values().iterator().next().pet;
                  if (who != null) onTap(who);
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) { }

              // ------------------------------------------------------------------ 设置变化

              @Override
              public void onSharedPreferenceChanged(SharedPreferences sp, String key) {
                  if (key == null) return;
                  if (key.equals(Prefs.KEY_SIZE) || key.startsWith(Prefs.PREFIX_VISIBLE)) {
                      if (!hidden) {
                          removeAll();
                          showAll();
                      }
                  } else if (key.equals(Prefs.KEY_SHAKE)) {
                      updateSensor();
                  } else if (key.equals(Prefs.KEY_CHAIN) && !prefs.chain()) {
                      for (Runnable r : pendingReplies.values()) main.removeCallbacks(r);
                      pendingReplies.clear();
                  }
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }

              /** 给设置页用：启动 / 发指令。 */
              static void send(Context ctx, String action) {
                  Intent i = new Intent(ctx, PetService.class).setAction(action);
                  if (ACTION_START.equals(action) || !running) {
                      ctx.startForegroundService(i);
                  } else {
                      ctx.startService(i);
                  }
              }
          }
