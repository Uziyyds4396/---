          # 桌宠三连 · 安卓版

          薄肌 · 太对了 · 峰哥，三个人头浮在手机屏幕上，点一下说一句，凑在一起会接话。

          移植自 macOS 原版：[SunPet](https://github.com/Ganzhe2028/SunPet)、[ShaolanPet](https://github.com/Ganzhe2028/ShaolanPet)、[FengGe-Desktop-Pet](https://github.com/Ganzhe2028/FengGe-Desktop-Pet)。

          ## 怎么玩

          | 操作 | 结果 |
          | --- | --- |
          | 点人头 | 随机说一句，带字幕和摇头动画；一轮播完前不重复 |
          | 点薄肌 | 四句一串：薄肌 → 太对了 → 峰哥 → 太对了 |
          | 点峰哥 | 太对了接一句就停 |
          | 点太对了 | 只说自己的 |
          | 拖动 | 换位置，退出后还记得 |
          | 长按人头 | 打开设置 |
          | 摇手机（默认关） | 太对了说一句 |
          | 通知栏 | 隐藏 / 显示 / 退出 |

          设置页里每个角色都能单独：显示或隐藏、随机或固定播一句、勾选轮播内容（每句带 ▶ 试听）。全局可调音量、头像大小、捧哏联动开关。

          薄肌默认只开 8 句能独立成立的（和原版一致），其余 29 句在「轮播内容」里勾回来。

          ## 编译（不需要电脑）

          APK 由 GitHub Actions 在云端编译，音频和头像在编译时从三个原版仓库拉取（锁定版本），本仓库不分发素材。

          1. 新建一个 GitHub 仓库，把本项目全部文件传上去（`.github/workflows/build.yml` 一定要在）。
          2. push 到 `main` 后 Actions 自动开始跑，约 3–5 分钟。
          3. 跑完去仓库的 **Releases**，下载 `PetTrio.apk`。

          ## 安装

          1. 手机允许「安装未知来源应用」，装 `PetTrio.apk`。
          2. 打开「桌宠三连」→ 授予「显示在其他应用上层」→ 允许通知。
          3. 点「召唤桌宠」。

          所有版本用同一个签名，以后重新编译的新版可以直接覆盖安装。

          国产系统（MIUI / HyperOS、ColorOS、OriginOS、鸿蒙等）后台管得严，桌宠被杀的话：在系统设置里把「桌宠三连」设为电池「无限制」/ 允许自启动 / 在最近任务里锁定。

          ## 用电脑编译

          ```sh
          bash tools/fetch_upstream.sh upstream
          python3 tools/prepare_assets.py upstream .
          gradle :app:assembleRelease      # 需要 JDK 17、Android SDK 34、Gradle 8.9
          ```

          或者跑完前两步后用 Android Studio 打开。

          ## 素材声明

          音频和头像版权归原权利人，**不在 MIT 许可范围内**，仅供学习交流和玩梗，请勿商用。来源与时间码见三个原版仓库的 `NOTICE.md` 和 `Assets/clips.json`。交互、句池和接话节奏（默认提前 0.3 秒、第二跳 0.2 秒、按每句开头静音补偿）沿用原版设计。

          签名密钥 `app/pettrio.keystore` 是为这个小玩具生成的一次性密钥，密码写在 `app/build.gradle` 里，不要拿去签别的东西。
