          # 用法：bash tools/fetch_upstream.sh <目标目录>
          set -euo pipefail
          dest="${1:-upstream}"
          mkdir -p "$dest"
          while read -r repo sha; do
            [ -z "$repo" ] && continue
            if [ ! -d "$dest/$repo/.git" ]; then
              git clone --quiet "https://github.com/Ganzhe2028/$repo.git" "$dest/$repo"
            fi
            git -C "$dest/$repo" checkout --quiet "$sha"
            echo "$repo @ $sha"
          done <<'EOF'
